x-linuxserver-environment: &linuxserver-environment
  TZ: ${TZ}
  PUID: ${PUID}
  PGID: ${PGID}

x-linuxserver-service: &linuxserver-service
  restart: unless-stopped

  environment:
    <<: *linuxserver-environment


services:

  #############################################################################
  # Infrastructure
  #############################################################################

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun

    cap_add:
      - NET_ADMIN

    restart: unless-stopped

    ports:
      - "8888:8888"
      - "8080:8080"
      - "9696:9696"

    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun

    environment:
      TZ: ${TZ}

      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared

    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    restart: unless-stopped


  #############################################################################
  # Download Automation
  #############################################################################

  qbittorrent:
    <<: *linuxserver-service

    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy

    environment:
      <<: *linuxserver-environment
      WEBUI_PORT: 8080

    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}/torrents:/downloads

  prowlarr:
    <<: *linuxserver-service
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr

    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy

    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config

  sonarr:
    <<: *linuxserver-service
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr

    ports:
      - "8989:8989"

    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}/tv:/tv
      - ${MEDIA_ROOT}/torrents:/downloads


  radarr:
    <<: *linuxserver-service
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr

    ports:
      - "7878:7878"

    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}/movies:/movies
      - ${MEDIA_ROOT}/torrents:/downloads


  #############################################################################
  # Media Server
  #############################################################################

  jellyfin:
    <<: *linuxserver-service
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin

    ports:
      - "8096:8096"

    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}/movies:/movies
      - ${MEDIA_ROOT}/tv:/tv
      - ${MEDIA_ROOT}/home-movies:/home-movies
      - ${MEDIA_ROOT}/family-av:/family-av


#############################################################################
# Network
#############################################################################

networks:
  default:
    name: kingypi-nas
